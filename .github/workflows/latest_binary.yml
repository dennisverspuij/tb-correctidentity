# based on https://github.com/actions/upload-latest-asset

on:
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

name: Upload Latest Asset

permissions:
  contents: write

jobs:
  build:
    name: Upload Latest Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Build project # This would actually build your project, using zip for an example artifact
        run: |
          git tag "latest" --force
          ./make_xpi.sh
      - name: Publish Latest Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/latest \
              -f sha="$GITHUB_SHA" \
              >/dev/null
          fi
          if gh release view latest >/dev/null; then
            gh release edit latest --prerelease --title ".xpi from current repo"
          else
            gh release create latest \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title ".xpi from current repo" \
              --notes ""
          fi
          gh release upload latest \
            ./correct_identity_latest.xpi \
            ./correct_identity_latest_dev.xpi \
            --clobber
